<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuse Point – Workflow</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c1c1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fuse Point">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f8f3e0; --card:#fffdf6; --ink:#1c1c1c; --muted:#6b6658; --line:#e4dcc2; --soft:#efe7cc;
  --orange:#fe3d1e; --lime:#bbff00; --blue:#0046c1; --purple:#27144c;
  --ok:#1f7a3a; --warn:#a85d00; --late:#d42c10;
  --radius:18px; --tourH:0px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,.disp{font-family:"Unbounded",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
a{color:var(--blue)}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + var(--tourH) + 10px) 14px calc(env(safe-area-inset-bottom) + 100px)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:#fff;border-radius:22px;padding:10px 10px 10px 14px;margin-bottom:6px;position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;right:-40px;top:-60px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,var(--orange) 0,transparent 70%);opacity:.35;pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;z-index:1}
.brand img{height:46px;width:auto;display:block}
.brand .t1{font-family:"Unbounded";font-weight:800;font-size:15px;line-height:1.1}
.brand .t2{font-size:12px;color:var(--lime);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.me{display:flex;align-items:center;gap:8px;border:none;background:var(--lime);color:var(--ink);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-weight:700;font-size:14px;z-index:1}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;font-size:11px;flex:none;font-family:"Unbounded"}
.av.sm{width:22px;height:22px;font-size:9px}
img.av{object-fit:cover;display:inline-block;padding:0}
.av.xl{width:84px;height:84px;font-size:26px}
.photo-edit{display:flex;align-items:center;gap:14px;margin:14px 0 4px}
.banner{background:#fff4c9;border:1.5px solid var(--ink);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:14px;margin:10px 0}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px;gap:8px}
.section-title h2{font-size:16px;font-weight:800}
.section-title span{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.card.alert{border-color:var(--orange);background:#fff1ec}
.card.focus{border-color:var(--ink);box-shadow:4px 4px 0 var(--lime), 4px 4px 0 1.5px var(--ink)}
.tap{cursor:pointer;transition:transform .08s ease}
.tap:active{transform:scale(.985)}
.ev{display:flex;gap:12px}
.datebox{flex:none;width:54px;border-radius:14px;background:var(--ink);color:#fff;text-align:center;padding:7px 0}
.datebox b{display:block;font-family:"Unbounded";font-size:20px;line-height:1.1}
.datebox span{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--lime);font-weight:700}
.ev-main{flex:1;min-width:0}
.ev-title{font-weight:700;font-size:16px;margin:3px 0 2px;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--purple);color:#fff;margin-right:4px;vertical-align:middle}
.tag.workshop{background:var(--blue)}
.tag.special{background:var(--orange)}
.tag.plain{background:var(--soft);color:var(--ink)}
.tag.late{background:var(--orange);color:#fff}
.tag.soon{background:#ffd98a;color:#4a2c00}
.tag.ok{background:var(--lime);color:var(--ink)}
.tag.skip{background:var(--soft);color:var(--muted)}
.tag.r-teacher{background:var(--ink);color:var(--lime)}
.tag.r-dj{background:var(--lime);color:var(--ink)}
.tag.r-guest{background:var(--purple);color:var(--lime)}
.dots{display:flex;gap:4px;margin:12px 0 8px}
.dots i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.dots i.done{background:var(--ink)}
.dots i.open{background:var(--orange)}
.dots i.skipped{background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px);border:1px solid var(--line)}
.nextl{display:flex;flex-direction:column;gap:5px}
.next{font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.next b{font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);border-radius:14px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;text-decoration:none;min-height:46px;text-align:center}
.btn.accent{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.lime{background:var(--lime);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.msg{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > .btn{flex:1}
.empty{text-align:center;color:var(--muted);padding:24px 16px;font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:none;background:transparent;border-radius:10px;padding:8px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.month{font-family:"Unbounded";font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 4px 8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;padding:0 10px calc(env(safe-area-inset-bottom) + 8px);display:flex;justify-content:center;z-index:20;pointer-events:none}
nav.tabs .inner{display:flex;max-width:540px;width:100%;background:var(--ink);border-radius:22px;padding:6px;pointer-events:auto;box-shadow:0 6px 20px rgba(28,28,28,.25)}
nav.tabs button{flex:1;border:none;background:none;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:#bdb6a0;cursor:pointer;position:relative;border-radius:16px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--ink);background:var(--lime)}
.badge{position:absolute;top:0;left:calc(50% + 5px);background:var(--orange);color:#fff;font-size:10px;border-radius:999px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--ink)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(28,28,28,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:calc(92vh - var(--tourH));overflow:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 20px);animation:up .2s ease}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px;position:relative}
.grab::before{content:"";position:absolute;left:-60px;right:-60px;top:-14px;bottom:-14px}
.sheet{touch-action:pan-y;will-change:transform}
.sheet h2{font-size:20px;font-weight:800;margin-bottom:4px;line-height:1.2}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
label.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.in{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;min-height:46px;font-size:16px}
.in:focus{outline:none;border-color:var(--ink)}
textarea.in{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer;font-weight:500}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.new{border-style:dashed}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.fbbox{background:var(--card);border:1.5px solid var(--blue);border-radius:16px;padding:12px;margin-top:8px}
.fbbox h3{font-size:14px;color:var(--blue);display:flex;align-items:center;gap:6px}
/* stepper */
.steps{position:relative;margin:8px 0}
.step{display:flex;gap:12px;position:relative;padding-bottom:16px}
.step:not(:last-child)::before{content:"";position:absolute;left:15px;top:34px;bottom:0;width:2px;background:var(--line)}
.step.done:not(:last-child)::before{background:var(--ink)}
.sdot{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--muted);z-index:1}
.step.done .sdot{background:var(--ink);border-color:var(--ink);color:var(--lime)}
.step.skipped .sdot{background:var(--soft);color:var(--muted)}
.step.open .sdot{border-color:var(--orange);color:var(--orange);box-shadow:0 0 0 4px #ffd8cf}
.sbody{flex:1;min-width:0}
.step.open .sbody{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-top:-4px}
.sname{font-weight:700}
.sowner{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap}
.due{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
.due input{border:1.5px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--card);font-size:14px}
.btn.resend{min-height:30px;padding:4px 12px;font-size:13px;margin-top:8px;border-color:var(--blue);color:var(--blue)}
.linkbtn{background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;padding:4px 0;cursor:pointer;text-decoration:underline}
.cl{margin-top:8px}
.cl .grp{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:10px 0 2px;display:flex;align-items:center;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed var(--line)}
.item:first-child{border-top:none}
.cb{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--ink);background:var(--card);display:grid;place-items:center;cursor:pointer;font-weight:800;padding:0}
.cb.on{background:var(--lime)}
.cb:disabled{opacity:.5;cursor:default}
.item .lbl{font-size:14px}
.byline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:3px}
.byline .av.sm{width:18px;height:18px;font-size:8px}
.item.done .lbl{text-decoration:line-through;color:var(--muted)}
.item.skip .lbl{color:var(--muted)}
.mini-link{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:2px}
.note{background:#fff1ec;border-left:3px solid var(--orange);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
.guest{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.guest:first-child{border-top:none}
.gi{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:18px;flex:none}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + var(--tourH) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--lime);font-weight:700;padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;animation:fade .15s;max-width:90vw;text-align:center}
.who{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--tourH) + 24px) 24px 24px;max-width:560px;margin:0 auto;overflow:auto}
.who h2{font-size:26px;font-weight:800;margin-bottom:6px}
.who .opt{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:8px;cursor:pointer;font-weight:700;font-size:17px;width:100%;text-align:left}
.who .opt small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.search{margin-bottom:10px}
.danger{color:var(--late)}
.srow{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;font:inherit;color:inherit}
.srow:first-child{border-top:none}
.srow b{font-size:15px}
.sicon{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:19px;flex:none}
.avrow{display:inline-flex;gap:3px;margin-top:3px}
.ggroup{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:10px 12px 12px;margin-top:10px}
.ghead{display:flex;justify-content:space-between;align-items:center;width:100%;border:none;background:none;padding:2px 0 6px;font-weight:700;font-size:15px;cursor:pointer}
.gtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gtile{background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:10px 4px 8px;text-align:center;cursor:pointer;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.gtile:active{transform:scale(.97)}
.gtile b{font-size:12.5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtile small{font-size:10.5px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:"Unbounded";font-weight:800;font-size:13px;margin-bottom:4px}
.gav.r-teacher{background:var(--ink);color:var(--lime)}.gav.r-dj{background:var(--lime);color:var(--ink)}.gav.r-guest{background:var(--purple);color:var(--lime)}
/* calendar */
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 2px 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{border-radius:16px;padding:10px;text-align:center;color:#fff}
.stat b{display:block;font-family:"Unbounded";font-size:22px}
.stat span{font-size:12px;opacity:.85}
.mhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.mhead h3{font-size:15px;font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .wd{font-size:10px;font-weight:700;color:var(--muted);padding-bottom:2px}
.cal .d{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-size:13px;border:none;background:none;padding:0;cursor:default}
.cal .d.add{cursor:pointer}
.cal .d.add:hover{background:var(--soft)}
.cal .d.past{color:#c3bba2}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--ink);font-weight:700}
.cal .d.has{color:#fff;font-weight:800;cursor:pointer}
.cal .d.has.social{background:var(--purple)}
.cal .d.has.workshop{background:var(--blue)}
.cal .d.has.special{background:var(--orange)}
.cal .d.has.past{opacity:.4}
.mlist{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.mline{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;cursor:pointer}
.mline .when{width:52px;color:var(--muted);font-size:12px;flex:none}
.mline .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.mini{display:flex;gap:2px;flex:none}
.mini i{width:8px;height:8px;border-radius:2px;background:var(--line)}
.mini i.done{background:var(--ink)}.mini i.open{background:var(--orange)}.mini i.skipped{background:var(--soft);outline:1px solid var(--line)}
.gap{font-size:13px;color:var(--warn);font-weight:700;margin-top:8px}
/* tour */
#tour{position:fixed;top:0;left:0;right:0;z-index:70;display:flex;justify-content:center;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;pointer-events:none}
#tour .tc{pointer-events:auto;width:100%;max-width:560px;background:var(--purple);color:#fff;border-radius:20px;padding:12px 14px;box-shadow:0 8px 24px rgba(28,28,28,.3)}
#tour .tk{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--lime)}
#tour .tk button{background:none;border:none;color:#d7cdea;font-size:12px;font-weight:700;cursor:pointer;padding:2px 0;text-decoration:underline}
#tour h3{font-size:15px;margin:5px 0 4px;line-height:1.25}
#tour p{margin:0;font-size:14px;line-height:1.4;color:#efe9f8}
#tour .tb{display:flex;gap:8px;margin-top:10px;align-items:center}
#tour .tb .bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
#tour .tb .bar i{display:block;height:100%;background:var(--lime)}
#tour .tb button{border:none;border-radius:11px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:14px}
#tour .back{background:rgba(255,255,255,.14);color:#fff}
#tour .nx{background:var(--lime);color:var(--ink)}
#tour .strip{display:flex;align-items:center;gap:8px;font-size:13px}
#tour .strip span{flex:1}
#tour .strip button{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:9px;padding:6px 10px;font-weight:700;font-size:13px;cursor:pointer}
#splash{position:fixed;inset:0;z-index:100;background:var(--ink);display:grid;place-items:center;perspective:700px;animation:splashOut .35s ease 1.1s forwards}
#splash img{width:132px;height:auto;animation:logoSpin 1s cubic-bezier(.3,.1,.2,1) both}
@keyframes logoSpin{0%{transform:rotateY(-360deg) scale(.7);opacity:0}25%{opacity:1}100%{transform:rotateY(0) scale(1);opacity:1}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion: reduce){#splash img{animation:none}#splash{animation:splashOut .3s ease .4s forwards}}

.gate{position:fixed;inset:0;z-index:90;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);overflow:auto}
.gate[hidden]{display:none}
.gbox{width:100%;max-width:380px;text-align:center}
.glogo{width:110px;height:auto;display:block;margin:0 auto 10px}
.gt1{font-family:"Unbounded";font-weight:800;font-size:20px}.gt2{color:var(--lime);font-weight:700;letter-spacing:.12em;font-size:12px;margin-bottom:22px}
.gmsg{color:#e9e4d4;font-size:15px;line-height:1.45;margin:0 0 16px}.gsmall{color:#bdb6a0;font-size:13px}
.gerr{color:#ff9b8a;font-size:14px;min-height:1px;margin:6px 0 10px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:50px;border-radius:14px;border:none;background:var(--lime);color:var(--ink);font-weight:800;font-size:16px;cursor:pointer;margin-top:10px;font-family:inherit}
.gbtn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.25);font-weight:700}
.gbtn:disabled{opacity:.5}
.glabel{display:block;text-align:left;font-size:13px;font-weight:700;color:#bdb6a0;margin:12px 0 5px}
.gin{width:100%;min-height:46px;border-radius:12px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;padding:10px 12px;font:inherit;font-size:16px}
.gin.gpin{text-align:center;font-size:28px;letter-spacing:.4em;font-family:"Unbounded"}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><img src="icons/logo-white.png" alt=""></div>
<div class="app" id="app">

/* ---------- state ---------- */
let db = null, realDb = null, canWrite = true, realCanWrite = true;
const realData = {events:[],guests:[],settings:{},photos:{},loaded:false};
let demoData = null, demoDb = null, demo = false, tourIdx = -1, focusId = null, activeTour = null, activeTourName = "all";
let events = [], guests = [], settings = {}, photos = {};
let tab = "tasks", evFilter = "upcoming", guestQuery = "", guestSort = "az", guestRole = "all";
const guestFold = new Set(), guestOpen = new Set();

try{ me = localStorage.getItem("fp_me"); }catch(e){}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ds = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayStr = () => ds(new Date());
const parseD = s => { if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const fmt = (s,o={day:"numeric",month:"short"}) => s ? parseD(s).toLocaleDateString("en-GB",o) : "";
const fmtLong = s => fmt(s,{weekday:"short",day:"numeric",month:"long"});
const daysUntil = s => Math.round((parseD(s) - parseD(todayStr()))/86400000);
const addDays = (s,n) => { const d=parseD(s); d.setDate(d.getDate()+n); return ds(d); };
const av = (n,sm,xl) => { const c=COLORS[n]||["#888","#fff"]; const cls=`av${sm?" sm":""}${xl?" xl":""}`; const ph=photos[n];
  return ph && /^data:image\//.test(ph) ? `<img class="${cls}" src="${esc(ph)}" alt="${esc(n)}">` : `<span class="${cls}" style="background:${c[0]};color:${c[1]}">${esc((n||"?").slice(0,2))}</span>`; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const slug = s => s.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60) || "item";
const tagsFor = names => names.map(n=>"@"+n).join(" ");
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2400); }

/* ---------- checklists ---------- */
function parseLine(line){
  let parts = line.split(":").map(s=>s.trim()).filter(Boolean);
  let owner=null, group=null;
  if(parts.length>1 && (MEMBERS.includes(parts[0]) || parts[0]==="Team")) owner = parts.shift();
  if(parts.length>1) group = parts.shift();
  return {id:slug(line), label:parts.join(": "), group, owner};
}
function items(key){
  const lines = (settings.templates && Array.isArray(settings.templates[key]) && settings.templates[key].length) ? settings.templates[key] : DEFAULT_TPL[key];
  return (lines||[]).map(parseLine);
}
const itemOwners = (it, s) => it.owner==="Team" ? MEMBERS : it.owner ? [it.owner] : s.who;
const itemState = (ev, key, id) => ev.steps?.[key]?.items?.[id]?.s || "";

/* ---------- step logic ---------- */
function stepState(ev, k){
  const s = STEPS[k], st = ev.steps?.[s.key] || {};
  if(st.skipped) return "skipped";
  if(st.done) return "done";
  return gatesOk(ev, s) ? "open" : "locked";
}
function gatesOk(ev, s){
  return s.gate.every(g => {
    if(g==="@date") return ev.date <= todayStr();
    const gs = stepState(ev, SIDX[g]);
    if(gs==="done") return true;
    if(gs==="skipped") return gatesOk(ev, STEPS[SIDX[g]]);
    return false;
  });
}
const allDone = ev => STEPS.every((_,k)=>["done","skipped"].includes(stepState(ev,k)));
const openSteps = ev => STEPS.map((s,k)=>k).filter(k=>stepState(ev,k)==="open");
function myRole(ev, k, name){ // returns "mine" | "team" | null
  const s = STEPS[k];
  if(s.kind==="list"){
    const its = items(s.key).filter(it => !itemState(ev,s.key,it.id) && itemOwners(it,s).includes(name));
    if(!its.length) return null;
    return its.some(it => itemOwners(it,s).length===1) ? "mine" : "team";
  }
  if(!s.who.includes(name)) return null;
  return s.who.length===1 ? "mine" : "team";
}
const stuckDays = () => Math.max(1, Number(settings.stuckDays ?? 2) || 2);
const overdueBy = (ev,k) => { const d = ev.steps?.[STEPS[k].key]?.due; return d ? -daysUntil(d) : -999; };
const stuckSteps = ev => openSteps(ev).filter(k => overdueBy(ev,k) >= stuckDays());
const isStuck = ev => stuckSteps(ev).length>0;
const isTeacher = g => g && g.role!=="dj" && g.role!=="other";
const gname = g => (g && (g.artist||"").trim()) || g?.name || "";
const guestNames = ev => (ev.guestIds||[]).map(id => gname(guests.find(g=>g.id===id))).filter(Boolean);
const typeTag = ev => ev.type==="special" ? `<span class="tag special">Special</span>` : ev.type==="workshop" ? `<span class="tag workshop">Workshop</span>` : `<span class="tag">Social</span>`;
function dueInfo(ev,k){
  const due = ev.steps?.[STEPS[k].key]?.due; if(!due) return null;
  const n = daysUntil(due);
  if(n<0) return {cls:"late",txt:`${-n}d overdue`};
  if(n===0) return {cls:"soon",txt:"due today"};
  if(n<=3) return {cls:"soon",txt:`due in ${n}d`};
  return {cls:"plain",txt:`due ${fmt(due)}`};
}
function progressOf(ev,k){
  const s = STEPS[k]; if(s.kind!=="list") return "";
  const its = items(s.key); const n = its.filter(it=>itemState(ev,s.key,it.id)).length;
  return `${n}/${its.length}`;
}

/* ---------- data ---------- */
function subscribe(dbx, target, isDemo){
  const apply = () => { if(demo === isDemo){ events=target.events; guests=target.guests; settings=target.settings; photos=target.photos||{}; render(); refreshSheet(); } };
  const loadTimer = isDemo ? null : setTimeout(()=>{ if(!target.loaded){ statusMsg="Can't reach the shared data yet – check your connection."; render(); } }, 10000);
  dbx.collection("events").onSnapshot(snap => {
    target.events = snap.docs.map(d => ({id:d.id, ...d.data()}));
    if(!snap.metadata.fromCache){ clearTimeout(loadTimer); if(!isDemo && statusMsg.startsWith("Can't")) statusMsg=""; }
    target.loaded = true; apply();
  }, () => { clearTimeout(loadTimer); if(!isDemo){ statusMsg="Lost connection to the shared data. Reload later to see updates."; target.loaded=true; apply(); } });
  dbx.collection("guests").onSnapshot(snap => {
    target.guests = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
    apply();
  }, ()=>{});
  dbx.doc("settings/main").onSnapshot(s => { target.settings = s.exists ? s.data() : {}; apply(); }, ()=>{});
  dbx.collection("members").onSnapshot(snap => { const ph={}; snap.docs.forEach(d=>{ const v=d.data(); if(v && v.photo) ph[d.id]=v.photo; }); target.photos=ph; apply(); }, ()=>{});
}
async function initDb(){
  try{ realDb = await claude.use("db"); }catch(e){ realDb = null; }
  if(!realDb){ statusMsg="Open this page signed in on claude.ai to see and update the team's data. You can still try the demo under Settings."; realData.loaded=true; if(!demo){ canWrite=false; render(); } return; }
  try{
    const user = await claude.use("user");
    if(user && user.can){ const w = await user.can("data.write"); if(w===false) realCanWrite=false; }
  }catch(e){}
  if(!demo){ db = realDb; canWrite = realCanWrite; }
  subscribe(realDb, realData, false);
}
async function write(fn){
  if(!db || !canWrite){ toast("You can't edit right now"); return false; }
  try{ await fn(); return true; }
  catch(e){
    if(e && e.code==="invalid_argument"){ if(!demo){ canWrite=realCanWrite=false; render(); } toast("You don't have edit access"); }
    else if(e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,600+Math.random()*600)); try{ await fn(); return true; }catch(_){ toast("Couldn't save – try again"); } }
    else toast("Couldn't save – try again");
    return false;
  }
}

/* ---------- messages ---------- */
function appLine(){ return settings.appLink ? `\n👉 ${settings.appLink}` : ""; }
function driveLink(){ return settings.driveLink || DRIVE; }
const waGroup = () => settings.waGroup || WA_GROUP;
const msgTpl = k => (settings.msgTemplates && settings.msgTemplates[k]) || DEFAULT_MSG[k];
const timeRange = ev => ev.time ? (ev.endTime ? `${ev.time}–${ev.endTime}` : ev.time) : "";
function lineup(ev){
  const gs = (ev.guestIds||[]).map(id=>guests.find(g=>g.id===id)).filter(Boolean);
  const t = gs.filter(g=>isTeacher(g)).map(gname), d = gs.filter(g=>g.role==="dj").map(gname);
  return [t.length?`💃 Teacher: ${t.join(", ")}`:"", d.length?`🎧 DJ: ${d.join(", ")}`:""].filter(Boolean).join("\n");
}
const LINK_FIELDS = [["📸 Instagram","instagram"],["📘 Facebook","facebook"],["☁️ SoundCloud","soundcloud"],["▶️ YouTube","youtube"],["🌐 Website","website"]];
function personBlock(g){
  const out = [gname(g)];
  if((g.bio||"").trim()) out.push(g.bio.trim());
  const links = LINK_FIELDS.filter(([,k])=>(g[k]||"").trim()).map(([l,k])=>`${l}: ${g[k].trim()}`);
  if(links.length) out.push(links.join("\n"));
  return out.join("\n");
}
// teachers / djs: arrays of guest objects (or plain names)
function namesIntoDesc(text, teachers, djs){
  const toG = x => typeof x==="string" ? {name:x} : x;
  teachers = teachers.map(toG); djs = djs.map(toG);
  const T = teachers.map(gname).join(" & "), D = djs.map(gname).join(" & ");
  const isMarker = l => /^\s*(🔻)+\s*$/u.test(l);
  const isEnd = l => /^\s*(Fuse Point:|\((ENG|DK)\)|Welcome to Fuse Point|Velkommen til Fuse Point)/i.test(l);
  const lines = String(text||"").split("\n"); const out = []; let marker = 0, i = 0, m;
  while(i < lines.length){
    const line = lines[i];
    if(isMarker(line) && marker===0){
      marker++;
      // replace the whole artist area (all 🔻 blocks) up to the Fuse Point text
      while(i < lines.length && !isEnd(lines[i])) i++;
      const slots = [...(teachers.length ? teachers : [null]), ...(djs.length ? djs : [null])];
      slots.forEach(g => { out.push(line.trim()); out.push(g ? personBlock(g) : ""); out.push(""); });
      continue;
    }
    if((m = line.match(/^(.*workshop[^:]*with:)(.*)$/i))) out.push(T ? `${m[1]} ${T}` : m[1]);
    else if((m = line.match(/^(.*(?:jam|dance floor)[^:]*with:)(.*)$/i))) out.push(D ? `${m[1]} ${D}` : m[1]);
    else out.push(line);
    i++;
  }
  return out.join("\n");
}
const descTpl = () => settings.descTemplate || DEFAULT_DESC;
async function saveSettings(patch){ const cur = {...settings}; return write(()=>db.doc("settings/main").set({...cur, ...patch})); }
function fillTpl(tpl, ev, g){
  ev = ev || {};
  const map = {guest:g?.name||"", event:ev.title||"our event", date:ev.date?fmtLong(ev.date):"", time:timeRange(ev), where:ev.location||DEFAULT_WHERE, folder:driveLink(), fb:fbPage(), ig:igPage(), lineup:lineup(ev)};
  return tpl.replace(/\{(\w+)\}/g, (m,k)=> k in map ? map[k] : m).replace(/\n{3,}/g,"\n\n");
}
const fbPage = () => settings.fbPage || FB_PAGE, igPage = () => settings.igPage || IG_PAGE;
function lineupParts(ev){
  const gs = (ev.guestIds||[]).map(id=>guests.find(g=>g.id===id)).filter(Boolean);
  return {T: gs.filter(g=>isTeacher(g)).map(gname), D: gs.filter(g=>g.role==="dj").map(gname)};
}
function withLine(ev){
  const {T,D} = lineupParts(ev);
  if(T.length && D.length) return `\nw/ ${T.join(" & ")} and open floor w/ ${D.join(" & ")}.`;
  if(T.length) return `\nw/ ${T.join(" & ")}.`;
  if(D.length) return `\nopen floor w/ ${D.join(" & ")}.`;
  return "";
}
function msgAfter(ev, key){
  const d = fmtLong(ev.date);
  const w = withLine(ev);
  const drive = `• Pictures are in Drive folder "Guest - Pictures & Videos"\n${driveLink()}`;
  const skipCollect = ev.steps?.collect?.skipped;
  switch(key){
    case "plan": return skipCollect
      ? `${tagsFor(["Savan","Amalie"])}\nDate is confirmed! ${d}${w}\n\n• Savan – you can start on the promo material.\n• Amalie – you can create the Facebook event now.`
      : `${tagsFor(["Daniel","Amalie"])}\nDate is confirmed! ${d}${w}\n\n• Daniel – please contact the guests and collect bio, pictures & videos.\n• Amalie – you can create the Facebook event now.`;
    case "collect": return `${tagsFor(["Savan"])}\nAll pictures for ${d}${w}\nIt's in – ready for editing.\n\n${drive}`;
    case "edit": return `${tagsFor(MEMBERS.filter(n=>n!=="Savan" && n!==me))}\nPictures edited! ${d}${w}\n\n• Can one of you take a look and approve?\n${drive}`;
    case "approve": return `${tagsFor(["Amalie"])}\nPromo material ready! ${d}${w}\n\n• Ready for Facebook & Instagram!\n${drive}`;
    case "post": { const {T,D} = lineupParts(ev); const name = (T.length||D.length) ? titleFor(T,D) : ev.title;
      return `🎉 ${name} ${d} is live on Facebook, Instagram & the WhatsApp group! Please share it 💃🕺\n📘 ${fbPage()}\n📸 ${igPage()}`; }
  }
}
function msgSendBack(ev, note){
  return `${tagsFor(["Savan"])}\n↩️ Small changes for ${ev.title} (${fmtLong(ev.date)}) before we approve:\n“${note}”${driveLink(ev)?`\n📁 ${driveLink(ev)}`:""}${appLine()}`;
}
function msgReminder(ev, k){
  k = k ?? (stuckSteps(ev)[0] ?? openSteps(ev)[0]);
  const s = STEPS[k]; const due = ev.steps?.[s.key]?.due;
  let who = s.who;
  if(s.kind==="list"){ const open = items(s.key).filter(it=>!itemState(ev,s.key,it.id)); who=[...new Set(open.flatMap(it=>itemOwners(it,s)))]; }
  const late = due && daysUntil(due) < 0;
  return `${tagsFor(who)}\n⏰ Friendly reminder: "${s.label}" for ${ev.title} (${fmtLong(ev.date)})${due?(late?` was due ${fmt(due)}`:` is due ${fmt(due)}`):" is waiting"}. Anything you need help with?${appLine()}`;
}
const roleKey = g => g.role==="dj" ? "dj" : g.role==="other" ? "guest" : "teacher";
const roleLabel = g => g.role==="dj" ? "DJ" : g.role==="other" ? "Guest" : "Teacher";
const roleIcon = g => g.role==="dj" ? "🎧" : g.role==="other" ? "⭐" : "💃";
function msgGuest(g, ev){ return fillTpl(msgTpl(roleKey(g)), ev, g); }
function msgGroup(ev){ return fillTpl(msgTpl("group"), ev); }
const waUrl = (text, phone) => `https://wa.me/${phone?String(phone).replace(/[^\d]/g,""):""}?text=${encodeURIComponent(text)}`;
async function copyText(t, okMsg){
  try{ await navigator.clipboard.writeText(t); toast(okMsg||"Copied"); return true; }

/* ---------- sheet ---------- */
let sheetRefresher = null, sheetBack = null, navSkip = 0;
// --- phone back button: each open pop-up and each tab is a step in the history (#sheet / #tab-x)
function navPush(h){ try{ if(location.hash !== "#"+h) location.hash = h; }catch(_){ } }
function userCloseSheet(){ const b = sheetBack; if(b){ sheetBack=null; b(); } else closeSheet(); }
function openSheet(html, mount, refresher, back){
  const layer = $("#layer");
  const wasOpen = !!layer.firstElementChild;
  layer.innerHTML = `<div class="scrim"><div class="sheet" role="dialog"><div class="grab"></div><div class="sc">${html}</div></div></div>`;
  const scrim = layer.firstElementChild; const sheet = scrim.querySelector(".sheet");
  scrim.addEventListener("click", e => { if(e.target===scrim || e.target.closest("[data-close]")) userCloseSheet(); });
  sheetRefresher = refresher || null; sheetBack = back || null;
  if(!wasOpen){ if(navSkip>0) setTimeout(()=>{ if($("#layer").firstElementChild && location.hash!=="#sheet") navPush("sheet"); }, 150); else navPush("sheet"); }
  // swipe down to close
  let y0 = null, dy = 0, dragging = false;
  sheet.addEventListener("touchstart", e => {
    const ta = e.target.closest("textarea, select");
    if((sheet.scrollTop > 2 && !e.target.closest(".grab")) || (ta && ta.scrollTop > 0)){ y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0; dragging = false;
  }, {passive:true});
  sheet.addEventListener("touchmove", e => {
    if(y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if(!dragging && dy < -4){ y0 = null; return; }
    if(dy > 10){ dragging = true; if(e.cancelable) e.preventDefault(); sheet.style.transition = "none"; sheet.style.transform = `translateY(${dy-10}px)`; scrim.style.background = `rgba(28,28,28,${Math.max(0,.5-dy/800)})`; }
  }, {passive:false});
  const end = () => {
    if(y0 === null){ return; } y0 = null; if(!dragging) return; dragging = false;
    sheet.style.transition = "transform .2s ease";
    if(dy > 110){ sheet.style.transform = "translateY(110%)"; setTimeout(userCloseSheet, 170); }
    else { sheet.style.transform = ""; scrim.style.background = ""; }
  };
  sheet.addEventListener("touchend", end); sheet.addEventListener("touchcancel", end);
  mount && mount(sheet);
}
function closeSheet(){
  const had = !!$("#layer").firstElementChild;
  $("#layer").innerHTML=""; sheetRefresher=null; sheetBack=null;
  if(had && location.hash === "#sheet"){ navSkip++; try{ history.back(); }catch(_){ navSkip--; } }
}
window.addEventListener("hashchange", () => {
  if(navSkip > 0){ navSkip--; return; }
  const h = location.hash;
  const open = !!$("#layer").firstElementChild;
  if(h !== "#sheet" && open){
    // back pressed while a pop-up is open
    if(sheetBack){ const b = sheetBack; sheetBack = null; b(); if($("#layer").firstElementChild) navPush("sheet"); }
    else { $("#layer").innerHTML=""; sheetRefresher=null; sheetBack=null; }
    return;
  }
  if(h !== "#sheet" && document.querySelector(".who") && me){ closeWho(); return; }
  const m = h.match(/^#tab-(tasks|plan|events|guests|settings)$/);
  const t = m ? m[1] : (h==="" || h==="#" ? "tasks" : null);
  if(t && t !== tab){ tab = t; render(); window.scrollTo(0,0); }
});
function refreshSheet(){ if(sheetRefresher) sheetRefresher(); }

function renderPlan(){
  const now = new Date(); const t = todayStr();
  const first = new Date(now.getFullYear(), now.getMonth(), 1);
  const months = [...Array(6)].map((_,i)=>new Date(first.getFullYear(), first.getMonth()+i, 1));
  const end = ds(new Date(first.getFullYear(), first.getMonth()+6, 0));
  const inRange = events.filter(e => e.date >= ds(first) && e.date <= end);
  const cnt = k => inRange.filter(e=>(e.type||"social")===k).length;
  const gaps = months.filter(m => { const ms=ds(m), me2=ds(new Date(m.getFullYear(),m.getMonth()+1,0)); return !events.some(e=>e.date>=ms && e.date<=me2); })
    .map(m=>m.toLocaleDateString("en-GB",{month:"long"}));
  const add = canPlan();
  let h = `<div class="section-title"><h2>Next half year</h2><span>${esc(months[0].toLocaleDateString("en-GB",{month:"short"}))} – ${esc(months[5].toLocaleDateString("en-GB",{month:"short",year:"numeric"}))}</span></div>

    ${gaps.length?`<div class="banner">No events planned in <b>${esc(gaps.join(", "))}</b>${add?" – tap a date to add one.":"."}</div>`:""}
    <div class="legend"><span><i style="background:var(--purple)"></i>Social</span><span><i style="background:var(--blue)"></i>Workshop</span><span><i style="background:var(--orange)"></i>Special</span>${add?`<span>Tap an empty date to add</span>`:""}</div>`;
  months.forEach(m => {
    const y=m.getFullYear(), mo=m.getMonth(); const days=new Date(y,mo+1,0).getDate();
    const lead=(new Date(y,mo,1).getDay()+6)%7;
    const mEvents = events.filter(e=>{ const d=parseD(e.date); return d.getFullYear()===y && d.getMonth()===mo; }).sort((a,b)=>a.date.localeCompare(b.date));
    let cells = ["M","T","W","T","F","S","S"].map(x=>`<div class="wd">${x}</div>`).join("") + `<div></div>`.repeat(lead);
    for(let d=1; d<=days; d++){
      const s = ds(new Date(y,mo,d)); const evs = mEvents.filter(e=>e.date===s);
      const past = s < t, today = s===t;
      if(evs.length) cells += `<button class="d has ${evs[0].type||"social"}${past?" past":""}${today?" today":""}" data-ev="${evs[0].id}" title="${esc(evs.map(e=>e.title).join(", "))}">${d}</button>`;
      else cells += `<button class="d${past?" past":""}${today?" today":""}${add&&!past?" add":""}" ${add&&!past?`data-newdate="${s}"`:"disabled"}>${d}</button>`;
    }
    h += `<div class="card"><div class="mhead"><h3>${esc(m.toLocaleDateString("en-GB",{month:"long",year:"numeric"}))}</h3><span class="meta">${mEvents.length} event${mEvents.length===1?"":"s"}</span></div>
      <div class="cal">${cells}</div>
      ${mEvents.length ? `<div class="mlist">${mEvents.map(e=>`<div class="mline" data-ev="${e.id}"><span class="when">${esc(fmt(e.date,{weekday:"short",day:"numeric"}))}</span><span class="t">${esc(e.title)}</span><span class="mini">${STEPS.map((_,k)=>`<i class="${stepState(e,k)}"></i>`).join("")}</span></div>`).join("")}</div>`

    </div>`;
  });
  return h;
}

function renderGuests(){
  const q = guestQuery.trim().toLowerCase();
  const match = g => !q || [g.name,g.artist,g.style].some(v => (v||"").toLowerCase().includes(q));
  const stats = new Map(guests.map(g=>[g.id, guestStats(g)]));
  const byName = (a,b) => (a.name||gname(a)).localeCompare(b.name||gname(b), "da");
  const sorter = (a,b) => {
    if(guestSort==="za") return byName(b,a);

    return byName(a,b);
  };
  const ini = g => (g.name||gname(g)).split(/\s+/).map(x=>x[0]||"").join("").slice(0,2).toUpperCase();
  const tile = g => `<button type="button" class="gtile" data-guest="${g.id}"><span class="gav r-${g.role==="dj"?"dj":g.role==="other"?"guest":"teacher"}">${esc(ini(g))}</span><b>${esc(g.name||gname(g))}</b><small>${esc((g.artist||"").trim() && g.artist!==g.name ? g.artist : (g.style||roleLabel(g)))}</small></button>`;
  let h = `<div class="section-title"><h2>Teachers & DJs</h2>${db&&canWrite?`<button class="btn accent small" data-act="newGuest">+ Add</button>`:""}</div>
    <input class="in search" id="gSearch" placeholder="Search name, artist name or genre" value="${esc(guestQuery)}">
    <div style="display:flex;align-items:center;gap:8px;margin:0 2px 4px"><span class="meta">Sort by</span>
      <select class="in" id="gSort" style="min-height:36px;padding:6px 10px;font-size:14px;width:auto;flex:1">
        ${[["az","Name A–Z"],["za","Name Z–A"],["most","Most events"],["next","Next event"]].map(([k,l])=>`<option value="${k}" ${guestSort===k?"selected":""}>${l}</option>`).join("")}
      </select></div>`;
  if(!guests.length) return h + `<div class="empty"><b>No guests yet</b>Add the teachers and DJs you work with, with their contact info.</div>`;
  let any = false;
  [["teacher","💃 Teachers",g=>isTeacher(g)],["dj","🎧 DJs",g=>g.role==="dj"],["guest","⭐ Guests",g=>g.role==="other"]].forEach(([k,l,f]) => {
    const list = guests.filter(g=>f(g) && match(g)).sort(sorter);
    if(q && !list.length) return;
    any = true;
    const folded = guestFold.has(k) && !q, open = guestOpen.has(k) || !!q;
    const shown = open ? list : list.slice(0,6);
    h += `<div class="ggroup"><button type="button" class="ghead" data-gfold="${k}"><span>${l} <span class="meta" style="font-weight:500">${list.length}</span></span><span>${folded?"▸":"▾"}</span></button>`;
    if(!folded){
      h += list.length ? `<div class="gtiles">${shown.map(tile).join("")}</div>` : `<div class="meta" style="padding:6px 2px 8px">No ${l.split(" ")[1].toLowerCase()} yet.</div>`;
      if(list.length>6 && !q) h += `<button type="button" class="btn ghost small block" style="margin-top:8px" data-gall="${k}">${open?"Show less":`Show all ${list.length}`}</button>`;
    }
    h += `</div>`;
  });
  if(!any) h += `<div class="empty"><b>No matches</b>Try another name or genre.</div>`;
  return h;
}

function openEvent(id){
  let seen = false;
  const draw = () => {
    const ev = events.find(e=>e.id===id);
    const sc = document.querySelector(".sheet .sc"); if(!sc) return;
    if(!ev){ if(seen) closeSheet(); else sc.innerHTML = `<div class="empty">Loading…</div>`; return; }
    seen = true;
    const keep = sc.parentElement.scrollTop;
    const openNote = sc.querySelector("#sbNote"); const noteVal = openNote ? openNote.value : null;
    sc.innerHTML = eventDetailHtml(ev, noteVal!==null);
    if(noteVal!==null){ const n=sc.querySelector("#sbNote"); if(n) n.value=noteVal; }
    sc.parentElement.scrollTop = keep;
  };
  openSheet(`<div></div>`, sheet => {
    draw();
    sheet.addEventListener("click", e => onEventSheetClick(e, id, draw));
    sheet.addEventListener("change", e => onEventSheetChange(e, id));
  }, draw);
}
function checklistHtml(ev, s, editable){
  const its = items(s.key); let h = `<div class="cl">`; let lastG = undefined;
  if(editable && its.length>1){
    const anyOpen = its.some(it=>!itemState(ev,s.key,it.id)), anyDone = its.some(it=>itemState(ev,s.key,it.id)==="done");
    h += `<div class="row" style="gap:6px;margin:2px 0 4px">
      <button class="btn ghost small" style="min-height:30px;padding:4px 10px;font-size:13px" data-bulk="${s.key}|all" ${anyOpen?"":"disabled"}>☑️ Check all</button>
      <button class="btn ghost small" style="min-height:30px;padding:4px 10px;font-size:13px" data-bulk="${s.key}|none" ${anyDone?"":"disabled"}>⬜ Uncheck all</button></div>`;
  }
  its.forEach(it => {
    const grp = it.group;
    if(grp !== lastG && grp){ h += `<div class="grp">${grp==="Facebook"?"📘":grp==="Instagram"?"📸":grp==="WhatsApp"?"💬":"•"} ${esc(grp)}</div>`; }
    lastG = grp;
    const st = itemState(ev, s.key, it.id); const info = ev.steps?.[s.key]?.items?.[it.id] || {};
    const owners = itemOwners(it, s);
    h += `<div class="item ${st==="done"?"done":st==="skip"?"skip":""}">
      <button class="cb ${st==="done"?"on":""}" data-tick="${s.key}|${it.id}" ${editable&&st!=="skip"?"":"disabled"} aria-label="Tick">${st==="done"?"✓":""}</button>
      <div style="flex:1;min-width:0"><div class="lbl">${it.owner?`${it.owner==="Team"?"":av(it.owner,1)} `:""}${esc(it.label)}${st==="skip"?` <span class="tag skip">Not needed</span>`:""}</div>
        ${st&&info.by?`<div class="byline">${MEMBERS.includes(info.by)?av(info.by,1):""}<span>${st==="skip"?"Opted out by":"Ticked by"} <b>${esc(info.by)}</b>${info.at?` · ${esc(fmt(info.at))}`:""}</span></div>`:""}</div>
      ${s.key==="post" && it.group==="WhatsApp" && !st ? `<button class="btn small" style="min-height:30px;padding:4px 10px;background:#1FAF55;border-color:#1FAF55" data-groupmsg="1">Message group</button>`:""}
      ${editable?(st==="skip"?`<button class="mini-link" data-unskip="${s.key}|${it.id}">Undo</button>`:st?"":`<button class="mini-link" data-skipitem="${s.key}|${it.id}">Not needed</button>`):""}
    </div>`;
  });
  return h + `</div>`;
}
function eventDetailHtml(ev, noteOpen){

    ${ev.notes?`<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:700;font-size:14px">📝 Event description</summary><p style="margin:8px 0 0;white-space:pre-wrap;font-size:14px">${esc(ev.notes)}</p></details>`:""}
    ${(ev.notes || (editable && me!=="Savan")) ? `<div class="row" style="margin-top:8px">

    if(state==="done"){
      h += `<div class="meta" style="margin-top:4px">Done${st.by?` by ${esc(st.by)}`:""}${st.at?` · ${esc(fmt(st.at))}`:""}${editable&&s.kind!=="list"?` · <button class="linkbtn" data-reopen="${s.key}">Undo</button>`:""}</div>`;

        else if(s.kind==="approve"){

          h += `<div class="row" style="margin-top:10px"><button class="btn lime small" data-done="approve">✅ Approve & notify Amalie</button><button class="btn ghost small" data-sendback="1">↩️ Send back to Savan</button></div>`;

    }
    h += `</div></div>`;

  h += `</div>`;
  h += `<div class="section-title"><h2>Guests</h2><span>${gs.length}</span></div>`;

  if(editable && me!=="Savan") h += `<div class="row" style="margin-top:14px"><button class="btn ghost" data-editev="1">✏️ Edit event</button><button class="btn ghost danger" data-delev="1">Delete</button></div>`;
  h += `<button class="btn ghost block" style="margin-top:8px" data-close>Close</button>`;
  return h;
}
const needMe = () => { if(!me){ openWho(); return false; } return true; };
async function tick(ev, key, id, state){
  const s = STEPS[SIDX[key]];
  const cur = {...(ev.steps?.[key]?.items||{})};
  cur[id] = state ? {s:state, by:me, at:todayStr()} : {s:"", by:"", at:""};
  const all = items(key).every(it => cur[it.id]?.s);
  const wasDone = !!ev.steps?.[key]?.done;
  const patch = {items:{[id]:cur[id]}};
  if(all && !wasDone) Object.assign(patch,{done:true,by:me,at:todayStr()});
  if(!all && wasDone) Object.assign(patch,{done:false,by:"",at:""});
  const ok = await write(()=>db.doc("events/"+ev.id).update({steps:{[key]:patch}}));
  if(ok && all && !wasDone){
    const evNow = {...ev, steps:{...ev.steps, [key]:{...(ev.steps?.[key]||{}), ...patch, items:cur}}};
    notifyAfter(evNow, key);
  }
}
async function bulkTick(ev, key, mode){
  const cur = {...(ev.steps?.[key]?.items||{})}; const changed = {};
  items(key).forEach(it => {
    const st = cur[it.id]?.s || "";
    if(mode==="all" && !st){ cur[it.id] = changed[it.id] = {s:"done", by:me, at:todayStr()}; }
    if(mode==="none" && st==="done"){ cur[it.id] = changed[it.id] = {s:"", by:"", at:""}; }
  });
  if(!Object.keys(changed).length){ toast(mode==="all"?"Everything is already ticked":"Nothing to uncheck"); return; }
  const all = items(key).every(it => cur[it.id]?.s);
  const wasDone = !!ev.steps?.[key]?.done;
  const patch = {items:changed};
  if(all && !wasDone) Object.assign(patch,{done:true,by:me,at:todayStr()});
  if(!all && wasDone) Object.assign(patch,{done:false,by:"",at:""});
  const ok = await write(()=>db.doc("events/"+ev.id).update({steps:{[key]:patch}}));
  if(ok && all && !wasDone) notifyAfter({...ev, steps:{...ev.steps, [key]:{...(ev.steps?.[key]||{}), ...patch, items:cur}}}, key);
}
const NOTIFY_TO = {plan:"Daniel & Amalie", collect:"Savan", edit:"approvers", approve:"Amalie", post:"the team"};
function notifyAfter(ev, key){
  const titles = {plan:ev.steps?.collect?.skipped?"Tell Savan & Amalie":"Tell Daniel & Amalie", collect:"Tell Savan", edit:"Ask for approval", approve:"Tell Amalie", post:"It's live! Tell the team 🎉"};
  openNotify(titles[key], msgAfter(ev, key), {back: ()=>showStep(ev.id, key)});
}
async function onEventSheetClick(e, id, redraw){
  const ev = events.find(x=>x.id===id); if(!ev) return;
  const t = e.target.closest("button"); if(!t) return;
  const d = t.dataset;
  if(d.bulk){ if(!needMe()) return; const [k,m]=d.bulk.split("|"); await bulkTick(ev,k,m); return; }
  if(d.tick){ if(!needMe()) return; const [k,i]=d.tick.split("|"); await tick(ev,k,i, itemState(ev,k,i)==="done"?null:"done"); return; }
  if(d.skipitem){ if(!needMe()) return; const [k,i]=d.skipitem.split("|"); await tick(ev,k,i,"skip"); return; }
  if(d.unskip){ const [k,i]=d.unskip.split("|"); await tick(ev,k,i,null); return; }
  if(d.done){
    if(!needMe()) return;
    t.disabled = true;
    const patch = {done:true,by:me,at:todayStr()};
    const ok = await write(()=>db.doc("events/"+id).update({steps:{[d.done]:patch}}));
    if(ok) notifyAfter({...ev, steps:{...ev.steps,[d.done]:{...(ev.steps?.[d.done]||{}),...patch}}}, d.done); else t.disabled=false;
    return;
  }
  if(d.sendback){ const sc=document.querySelector(".sheet .sc"); sc.innerHTML = eventDetailHtml(ev, true); sc.querySelector("#sbNote")?.focus(); return; }
  if(d.sendbackgo){
    if(!needMe()) return;
    const note = (document.querySelector("#sbNote")?.value||"").trim(); if(!note){ toast("Write what should change"); return; }
    const reset = Object.fromEntries(items("edit").map(it=>[it.id,{s:"",by:"",at:""}]));
    const changes = [...(ev.steps?.approve?.changes||[]), {by:me, at:todayStr(), note}];
    const ok = await write(()=>db.doc("events/"+id).update({steps:{edit:{done:false,by:"",at:"",items:reset}, approve:{changes}}}));
    if(ok) openNotify("Tell Savan what to change", msgSendBack(ev, note), {back: ()=>showStep(id, "edit")});
    return;
  }
  if(d.reopen){ await write(()=>db.doc("events/"+id).update({steps:{[d.reopen]:{done:false,by:"",at:""}}})); return; }
  if(d.skipstep){ await write(()=>db.doc("events/"+id).update({steps:{[d.skipstep]:{skipped:true}}})); return; }
  if(d.unskipstep){ await write(()=>db.doc("events/"+id).update({steps:{[d.unskipstep]:{skipped:false}}})); return; }
  if(d.remind) { openNotify("Send a reminder", msgReminder(ev, +d.remind), {back: ()=>showStep(id, STEPS[+d.remind].key)}); return; }
  if(d.groupmsg){ openNotify("Message to the WhatsApp group", msgGroup(ev), {wa:true, back: ()=>showStep(id, "post")}); return; }
  if(d.copydesc){ copyText(ev.notes||"", "Description copied – paste it in Facebook"); return; }
  if(d.resend){ notifyAfter(ev, d.resend); return; }
  if(d.copyfolder){ const l = driveLink(); if(l) copyText(l, "Folder link copied – paste it to the guest"); else toast("Add the Drive folder link in Settings"); return; }
  if(d.askguest){ const g = guests.find(x=>x.id===d.askguest); if(g) openNotify(`Message ${g.name}`, msgGuest(g, ev), {guest:g, ev, back: ()=>showStep(id, "collect")}); return; }
  if(d.editev){ openEventForm(ev); return; }
  if(d.delev){
    if(d.confirm){ const ok = await write(()=>db.doc("events/"+id).delete()); if(ok){ closeSheet(); toast("Event deleted"); } }
    else { d.confirm="1"; t.textContent="Tap again to delete"; }
  }
}

/* ---------- team photos ---------- */
function resizePhoto(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { const S=200, c=document.createElement("canvas"); c.width=c.height=S; const x=c.getContext("2d");
      const m=Math.min(img.width,img.height); x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",0.82)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src = url;
  });
}
async function setPhoto(name, file){
  if(!file) return;
  if(!/^image\//.test(file.type)){ toast("Pick a photo"); return; }
  try{ const data = await resizePhoto(file); const ok = await write(()=>db.doc("members/"+name).set({photo:data})); if(ok) toast("Photo saved"); }
  catch(e){ toast("Couldn't read that photo"); }
}
async function removePhoto(name){ const ok = await write(()=>db.doc("members/"+name).set({photo:""})); if(ok) toast("Photo removed"); }

    ${photos[name]&&editable?`<button class="btn ghost small danger" data-rmphoto="${name}">Remove</button>`:""}</div></div>`;
}

}

/* ---------- demo: in-memory store ---------- */
function makeMockDb(){
  const store = {}; let subs = [];
  const clone = o => JSON.parse(JSON.stringify(o));
  const merge = (a,b) => { for(const k in b){ const v=b[k]; if(v && typeof v==="object" && !Array.isArray(v)) a[k]=merge(a[k]&&typeof a[k]==="object"?{...a[k]}:{}, v); else a[k]=v; } return a; };
  const emit = () => subs.forEach(f=>f());
  const meta = {fromCache:false,hasPendingWrites:false};
  const colSnap = p => { const n=p.split("/").length+1; const docs=Object.keys(store).filter(k=>k.startsWith(p+"/")&&k.split("/").length===n).sort().map(k=>({id:k.split("/").pop(),exists:true,data:()=>store[k],metadata:meta})); return {docs,size:docs.length,empty:!docs.length,metadata:meta,docChanges:()=>[]}; };
  const sub = f => { subs.push(f); setTimeout(f,0); return ()=>{ subs=subs.filter(x=>x!==f); }; };
  return {
    store, emit,
    collection: p => ({ onSnapshot: next => sub(()=>next(colSnap(p))) }),
    doc: p => ({
      get: async () => ({id:p.split("/").pop(),exists:!!store[p],data:()=>store[p],metadata:meta}),
      set: async d => { store[p]=clone(d); setTimeout(emit,0); },
      update: async d => { if(!store[p]) throw {code:"invalid_argument"}; store[p]=merge(clone(store[p]),clone(d)); setTimeout(emit,0); },
      delete: async () => { delete store[p]; setTimeout(emit,0); },
      onSnapshot: next => sub(()=>next({id:p.split("/").pop(),exists:!!store[p],data:()=>store[p],metadata:meta}))
    })
  };
}
const DEMO_BY = {plan:"David",collect:"Daniel",edit:"Savan",approve:"Champ",post:"Amalie"};
function demoBuild(date, spec){ // spec: {plan:true, collect:"all"|n|"skip", edit:..., approve:true, post:n|"all", after:n|"all"}
  const T = todayStr(); const steps = {};
  STEPS.forEach(s => {
    const due = addDays(date, DUE_OFF[s.key]);
    const st = {done:false,by:"",at:"",due,items:{}};
    const v = spec[s.key];
    if(v==="skip") st.skipped = true;
    else if(s.kind==="list"){
      const its = items(s.key); const n = v==="all" ? its.length : (v||0);
      its.forEach((it,i)=>{ if(i<n){ const owner = it.owner && it.owner!=="Team" ? it.owner : DEMO_BY[s.key]; st.items[it.id] = {s:"done",by:owner,at:due<T?due:T}; } });
      if(n>=its.length){ st.done=true; st.by=DEMO_BY[s.key]; st.at=due<T?due:T; }
    } else if(v){ st.done=true; st.by=DEMO_BY[s.key]; st.at=due<T?due:T; }
    steps[s.key] = st;
  });
  return steps;
}

function goTour(i){
  tourIdx = i; const st = activeTour[i];
  closeSheet(); closeWho();
  me = st.me; tab = st.tab; evFilter = "upcoming"; focusId = st.focus || null;
  setE1(st.stage);
  render(); renderTour(); window.scrollTo(0,0);
  if(st.open) setTimeout(()=>{ if(tourIdx===i) st.open(); }, 60);
  if(st.focus) setTimeout(()=>{ const c=document.querySelector(`#view .card[data-ev="${st.focus}"]`); if(c && tourIdx===i){ const y=c.getBoundingClientRect().top+window.scrollY-(parseInt(getComputedStyle(document.documentElement).getPropertyValue("--tourH"))||0)-70; window.scrollTo({top:Math.max(0,y),behavior:"smooth"}); } }, 120);
}
function renderTour(){
  const el = $("#tour");
  if(!demo){ el.innerHTML=""; setTourH(); return; }
  if(tourIdx<0){
    el.innerHTML = `<div class="tc"><div class="strip"><span>🧪 <b>Demo</b> · nothing is saved</span><button data-tour="restart">Restart tour</button><button data-tour="exit">Exit</button></div></div>`;
  } else {
    const st = activeTour[tourIdx];
    el.innerHTML = `<div class="tc">
      <div class="tk"><span>${activeTourName==="all"?"Team demo":`${esc(activeTourName)}'s tour`} · ${tourIdx+1}/${activeTour.length}${activeTourName==="all"?` · as ${esc(st.me)}`:""}</span><button data-tour="exit">Exit demo</button></div>
      <h3>${st.title}</h3><p>${st.text}</p>
      <div class="tb">${tourIdx>0?`<button class="back" data-tour="back">Back</button>`:""}<div class="bar"><i style="width:${Math.round((tourIdx+1)/activeTour.length*100)}%"></i></div>
      ${st.last?`<button class="back" data-tour="free">Explore</button><button class="nx" data-tour="exit">Exit demo</button>`:`<button class="nx" data-tour="next">${tourIdx===0?"Start":"Next"}</button>`}</div>
    </div>`;
  }
  setTourH();
}
function setTourH(){ requestAnimationFrame(()=>{ const c=$("#tour .tc"); document.documentElement.style.setProperty("--tourH", c ? (c.offsetHeight+8)+"px" : "0px"); }); }
window.addEventListener("resize", setTourH);
$("#tour").addEventListener("click", e => {
  const a = e.target.closest("[data-tour]")?.dataset.tour; if(!a) return;
  if(a==="next" && tourIdx<activeTour.length-1) goTour(tourIdx+1);
  if(a==="back" && tourIdx>0) goTour(tourIdx-1);
  if(a==="free"){ tourIdx=-1; focusId=null; closeSheet(); renderTour(); render(); }
  if(a==="restart"){ startDemo(activeTourName); }
  if(a==="exit") exitDemo();
});

/* ---------- global events ---------- */
document.addEventListener("click", e => { if(e.target.closest("[data-signout]") && window.fpSignOut) window.fpSignOut(); }, true);
document.addEventListener("click", async e => {
  if(e.target.closest("#layer") || e.target.closest(".who") || e.target.closest("#tour")) return;
  const tb = e.target.closest("[data-tab]"); if(tb){ const nt = tb.dataset.tab; if(nt!==tab){ tab = nt; render(); window.scrollTo(0,0); if(!demo) navPush("tab-"+nt); } else { window.scrollTo(0,0); } return; }
  if(e.target.closest("#meBtn")){ me ? openProfile(me) : openWho(); return; }
  if(e.target.closest('[data-act="who"]')){ openWho(); return; }
  const pf = e.target.closest("[data-profile]"); if(pf){ openProfile(pf.dataset.profile); return; }
  if(e.target.closest("[data-desc]")){ openDescEditor(); return; }
  const ss = e.target.closest("[data-sset]"); if(ss){ openSettingsSection(ss.dataset.sset); return; }
  const f = e.target.closest("[data-filter]"); if(f){ evFilter=f.dataset.filter; render(); return; }
  const gf = e.target.closest("[data-gfold]"); if(gf){ const k=gf.dataset.gfold; guestFold.has(k)?guestFold.delete(k):guestFold.add(k); render(); return; }
  const ga = e.target.closest("[data-gall]"); if(ga){ const k=ga.dataset.gall; guestOpen.has(k)?guestOpen.delete(k):guestOpen.add(k); render(); return; }
  const rm = e.target.closest("[data-remindev]"); if(rm){ const ev=events.find(x=>x.id===rm.dataset.remindev); if(ev) openNotify("Send a reminder", msgReminder(ev)); return; }
  const nd = e.target.closest("[data-newdate]"); if(nd){ openEventForm({date:nd.dataset.newdate}); return; }
  const evc = e.target.closest("[data-ev]"); if(evc){ openEvent(evc.dataset.ev); return; }
  const gc = e.target.closest("[data-guest]"); if(gc){ openGuestForm(guests.find(g=>g.id===gc.dataset.guest)); return; }
  const act = e.target.closest("[data-act]")?.dataset.act;
  if(act==="newEvent") openEventForm();
  if(act==="newGuest") openGuestForm();
  if(act==="startDemo") startDemo("all");
  if(act==="restartTour") startDemo(activeTourName);
  if(act==="myTour"){ if(!me){ openWho(); return; } startDemo(MEMBERS.includes(me) ? me : "all"); }
  if(act==="hideTourHint"){ try{ localStorage.setItem("fp_tourhint_"+me,"1"); }catch(_){ } render(); }
  if(act==="exitDemo") exitDemo();
});
document.addEventListener("change", e => {
  if(e.target.closest("#layer")) return;
  if(e.target.id==="gSort"){ guestSort = e.target.value; render(); return; }
  const i = e.target.closest("[data-photofor]"); if(i) setPhoto(i.dataset.photofor, i.files[0]);
});
document.addEventListener("input", e => {
  if(e.target.id==="gSearch"){ guestQuery = e.target.value; const pos=e.target.selectionStart; render(); const s=$("#gSearch"); s.focus(); try{s.setSelectionRange(pos,pos);}catch(_){} }
});

setTimeout(()=>document.getElementById("splash")?.remove(), 1700);
{ const m0 = location.hash.match(/^#tab-(tasks|plan|events|guests|settings)$/); if(m0) tab = m0[1]; }
render();
const hashTour = (location.hash.match(/^#demo-(david|champ|daniel|amalie|savan)$/i)||[])[1];
if(hashTour){ startDemo(hashTour[0].toUpperCase()+hashTour.slice(1).toLowerCase()); }
else if(location.hash==="#demo"){ startDemo("all"); }
else if(!me && !window.FP_FIREBASE) openWho();
window.fpSetMe = n => { me = n; realMe = n; try{ localStorage.setItem("fp_me", n); }catch(_){ } if(!demo){ render(); } };
initDb();
</script>
